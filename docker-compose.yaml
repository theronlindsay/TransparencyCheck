services:
  server:
    build:
      context: .
      dockerfile: docker/server/dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=1776
      - BETTER_AUTH_URL=https://api.transparencycheck.app
      - CORS_ORIGINS=https://transparencycheck.app,https://www.transparencycheck.app
      # Provide DATABASE_URL in .env / Dokploy (external Mongo). Do not use hostname "mongodb".
      - DATABASE_URL=${DATABASE_URL}
      # Keep the Bun process from ballooning on small hosts
      - NODE_OPTIONS=--max-old-space-size=384
    volumes:
      - pdf-cache:/app/.cache
      - server_logs:/app/logs
    ports:
      - "1776:1776"
    networks:
      - dokploy-network
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:1776/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  client:
    build:
      context: .
      dockerfile: docker/client/dockerfile
      args:
        VITE_API_BASE_URL: https://api.transparencycheck.app
    depends_on:
      - server
    environment:
      - PORT=8080
    ports:
      - "8080:8080"

volumes:
  pdf-cache:
  server_logs:

networks:
  dokploy-network:
    external: true
