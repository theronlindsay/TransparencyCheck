services:
  mongodb:
    image: mongo:8.2
    restart: unless-stopped
    # Cap WiredTiger cache so Mongo doesn't eat the whole Dokploy VPS.
    command: ['mongod', '--bind_ip_all', '--wiredTigerCacheSizeGB', '0.25']
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-password123}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username ${MONGO_ROOT_USER:-admin} --password ${MONGO_ROOT_PASSWORD:-password123} --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 })'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:27017:27017" # Bound strictly to localhost to prevent external access
    volumes:
      - mongodb_data:/data/db # Persists your database so data isn't lost on restart

  server:
    build:
      context: .
      dockerfile: docker/server/dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy # Wait for MongoDB to be ready before server starts
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=1776
      - BETTER_AUTH_URL=https://api.transparencycheck.app
      - CORS_ORIGINS=https://transparencycheck.app,https://www.transparencycheck.app
      - DATABASE_URL=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/transparency_check?authSource=admin
      # Keep the Bun process from ballooning on small hosts
      - NODE_OPTIONS=--max-old-space-size=384
    volumes:
      - pdf-cache:/app/.cache
      - server_logs:/app/logs
    ports:
      - "1776:1776"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:1776/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  client:
    build:
      context: .
      dockerfile: docker/client/dockerfile
      args:
        VITE_API_BASE_URL: https://api.transparencycheck.app
    depends_on:
      - server
    environment:
      - PORT=8080
    ports:
      - "8080:8080"

volumes:
  pdf-cache:
  mongodb_data:
  server_logs:
