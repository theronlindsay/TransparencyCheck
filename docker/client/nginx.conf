# Static file server for the built PWA. This container is internal-only: the
# `proxy` service terminates TLS, forwards non-/api/ traffic here, and sends
# /api/ straight to the `server` container.
#
# Nothing here proxies the API or rewrites CORS headers on purpose — the API
# already emits origin-allowlisted, credentials-enabled CORS headers, and the
# wildcard `Access-Control-Allow-Origin: *` this file used to add is invalid
# alongside credentials, which breaks cookie auth for the Capacitor app.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Add proper MIME types
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  types {
    application/javascript mjs;
  }

  # Hashed build assets: safe to cache forever
  location /_app/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # PWA files — must be served as real files, never fall back to index.html
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
